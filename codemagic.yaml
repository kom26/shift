workflows:
  ios-test:
    name: Shift iOS test
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    # 従量課金のため push では自動ビルドしない(単体テストは GitHub Actions が実行)。必要なときだけ手動で起動
    scripts:
      - name: Install xcodegen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: cd ios && xcodegen generate
      - name: Run unit tests
        script: |
          set -o pipefail
          cd ios
          mkdir -p build
          DEVICE=$(xcrun simctl list devices available | grep -E '^ +iPhone' | tail -1 | sed -E 's/^ +(.*) \([0-9A-Fa-f-]{36}\).*/\1/')
          [ -n "$DEVICE" ] || { echo "No iPhone simulator found"; exit 1; }
          echo "Using simulator: $DEVICE"
          code=0
          xcodebuild test \
            -project Shift.xcodeproj \
            -scheme Shift \
            -destination "platform=iOS Simulator,name=$DEVICE,OS=latest" \
            > build/test.log 2>&1 || code=$?
          echo "=== RESULT SUMMARY (exit $code) ==="
          grep -E "Test run with|Test Suite .* (passed|failed)|Executed [0-9]+ tests" build/test.log | tail -5
          if [ "$code" -ne 0 ]; then
            echo "=== FAILURE DETAILS ==="
            grep -E "error:|✘|Test Case .* failed|Testing failed|Crash|crashed|failed to launch" build/test.log | sort -u | head -60
          fi
          exit $code
    artifacts:
      - ios/build/test.log

  # TestFlight 配信用。`testflight-*` タグの push、または Codemagic での手動実行で動く
  ios-release:
    name: Shift iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'testflight-*'
          include: true
    integrations:
      app_store_connect: codemagic-admin
    environment:
      xcode: latest
      groups:
        - shift_signing   # CERTIFICATE_PRIVATE_KEY(secure)を入れたグループ
      vars:
        BUNDLE_ID: com.kom26.shift
    scripts:
      - name: Install xcodegen
        script: brew install xcodegen
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create signing files
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" ios/project.yml
          grep CURRENT_PROJECT_VERSION ios/project.yml
      - name: Generate Xcode project
        script: cd ios && xcodegen generate
      - name: Apply provisioning profiles
        script: cd ios && xcode-project use-profiles
      - name: Build ipa
        script: cd ios && xcode-project build-ipa --project Shift.xcodeproj --scheme Shift
    artifacts:
      - ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # 内部テストのみ。外部テスト(ベータ審査)には test-info の入力が必要
