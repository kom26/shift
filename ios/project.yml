name: Shift
options:
  bundleIdPrefix: com.kom26
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
targets:
  Shift:
    type: application
    platform: iOS
    sources:
      - Shift
      # 設定画面のウィジェットプレビューに、ウィジェットと同じ見た目を使う
      - path: Widget
        includes:
          - ShiftDayWidget.swift
          - ShiftWeekWidget.swift
          - WidgetModel.swift
          - WidgetIntents.swift
          - WidgetParts.swift
    info:
      path: ShiftInfo.plist
      properties:
        NSAlarmKitUsageDescription: 出勤前のアラームをセットするために使います
        NSPhotoLibraryAddUsageDescription: 招待の QR コードを画像として写真に保存するために使います
        CFBundleURLTypes:
          - CFBundleURLName: com.kom26.shift
            CFBundleURLSchemes:
              - shiftpalette
          # Google でサインインが戻ってくるときの URL(GoogleService-Info.plist の REVERSED_CLIENT_ID)
          - CFBundleURLName: google-signin
            CFBundleURLSchemes:
              - com.googleusercontent.apps.92285628811-4v744oqvmasi700bfd8mbrdrg133gck8
    entitlements:
      path: ShiftApp.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # QR や招待リンク(https://shift-palette.web.app/join/...)を、アプリで直接開く
        com.apple.developer.associated-domains:
          - applinks:shift-palette.web.app
        com.apple.security.application-groups:
          - group.com.kom26.shift
    dependencies:
      - target: ShiftWidget
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kom26.shift
        DEVELOPMENT_LANGUAGE: ja
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: シフトパレット
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ShiftWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      # アプリと同じ計算・見た目を使うため、画面に依存しないファイルだけ共有する
      - path: Shift/Core
        excludes:
          - AlarmService.swift
          - DragState.swift
          - WidgetSync.swift
      - Shift/Views/Theme.swift
      - Shift/Views/AppFont.swift
      - Shift/Views/Calendar/FixedWidthTime.swift
      - Shift/Views/Calendar/ArrowTagShape.swift
      - Shift/Resources/Fonts
    info:
      path: ShiftWidgetInfo.plist
      properties:
        CFBundleDisplayName: シフトパレット
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ShiftWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kom26.shift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kom26.shift.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: シフトパレット
        SKIP_INSTALL: YES
  ShiftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ShiftTests
    dependencies:
      - target: Shift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kom26.shift.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Shift:
    build:
      targets:
        Shift: all
    test:
      targets:
        - ShiftTests
